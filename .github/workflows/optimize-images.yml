name: Optimize Images

on:
  push:
    branches:
      - main
    paths:
      - 'original/**/*.jpg'
      - 'original/**/*.jpeg'
      - 'original/**/*.png'
      - 'original/**/*.webp'

jobs:
  optimize:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Sharp
        run: npm install sharp

      - name: Optimize Images
        run: |
          node .github/scripts/optimize.js

      - name: Commit Optimized Images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add optimized/
          git diff --staged --quiet || git commit -m "chore: optimize images [skip ci]"
          git push
